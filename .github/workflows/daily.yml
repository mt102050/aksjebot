name: daily

on:
  schedule:
    - cron: "30 5 * * 1-5"   # 05:30 UTC, ca. 06:30 eller 07:30 norsk tid. GitHub kan forsinke starten.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Kjør tester
        run: python -m pytest -q tests

      - name: Kjør boten
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.run

      - name: Lagre data
        run: |
          git config user.name "aksjebot"
          git config user.email "aksjebot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Daglig data"
          git push

      - name: Varsle ved krasj
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ]; then
            curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="Aksjebot krasjet i dag. Sjekk Actions-fanen i repoet."
          fi
